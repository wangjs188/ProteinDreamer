      repo: westlake-repl/SaProt_650M_AF2
      revision: d9b9ad00ef61c0990e611b2b43f2231c7de24b38
    expected_files:
    - config.json
    - vocab.txt
    - tokenizer_config.json
    - special_tokens_map.json
    - pytorch_model.bin
    checksum_lock: model/SAPROT_LOCK.json
  saprot_1p3b:
    local_path: model/SaProt_1.3B_AFDB_OMG_NCBI
    source:
      type: huggingface
      repo: westlake-repl/SaProt_1.3B_AFDB_OMG_NCBI
      revision: 3e000715b428e69a8ea166716727c8596bc3ddcf
    expected_files:
    - config.json
    - vocab.txt
    - tokenizer_config.json
    - special_tokens_map.json
    - model.safetensors
    checksum_lock: model/SAPROT_LOCK.json
  proteingym_data:
    local_path: data/ProteinGym_v1_SaProt_AF2_v2
    source:
      type: http
      urls:
      - https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/DMS_ProteinGym_substitutions.zip
    provision_script: script/setup/download_proteingym_dataset.sh
    postprocess_script: script/setup/prepare_proteingym_saprot_dataset.sh
optional_cache_build_inputs:
  proteingym_msa_files:
    local_path: data/proteingym_downloads/raw/DMS_msa_files
    contents: ProteinGym DMS alignment files (*.a2m)
    source_url: https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/DMS_msa_files.zip
    note: Locate the actual extracted folder if the archive nests directories.
  proteingym_msa_weights:
    local_path: data/proteingym_downloads/raw/DMS_msa_weights
    contents: ProteinGym MSA sequence weights (*.npy)
    source_url: https://marks.hms.harvard.edu/proteingym/ProteinGym_v1.3/DMS_msa_weights.zip
optional_build_dependency:
  cherryml:
    local_path: external/CherryML
    source:
      type: git
      url: https://github.com/songlab-cal/CherryML.git
    tested_version: v0.2.0
    purpose: rebuilding the SiteRM teacher cache
tools:
  foldseek:
    required: true
    expected_cmd: foldseek
    purpose: SaProt 3Di tokenization for model inference; not required for CPU metric
      reproduction
included_metric_assets:
  local_path: data/metric_0546
  provenance: data/metric_0546/PROVENANCE.json
  assays: 217
  variants: 2465767
